<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Bulk Brainstorming Sheet Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* Screen Preview Styling */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
        }

        /* Print Settings to force high quality A4 PDF output without blank pages */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                min-height: 297mm !important;
                padding: 15mm !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            main {
                display: block !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <!-- Header -->
    <header class="no-print bg-slate-900 text-white shadow-md py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight">UPSC Bulk Brainstorming Sheet Generator</h1>
                <p class="text-xs text-slate-400">Paste multiple questions to generate multi-page brainstorming booklets in seconds.</p>
            </div>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 002-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                Print / Save as PDF
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-16 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Controls Sidebar -->
        <div class="no-print lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-5 h-fit">
            <h2 class="font-semibold text-slate-900 border-b pb-3 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                Bulk Questions Input
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Global Subject / Header Topic</label>
                <input type="text" id="globalTopic" value="General Studies - Indian Economy & Governance" oninput="renderSheets()" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Questions List (One per line)</label>
                <textarea id="bulkQuestions" rows="12" oninput="renderSheets()" placeholder="Paste your 50 questions here..." class="w-full text-xs font-mono border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">Discuss the salient features of the Harappan architecture. [10 Marks, 150 Words] (2025)
Examine the main aspects of Akbar's religious syncretism. [10 Marks, 150 Words] (2025)
With a consideration towards the strategy of inclusive growth, the new Companies Bill, 2013 has indirectly made CSR a mandatory obligation. Discuss the challenges expected in its implementation in right earnest. [12.5 Marks, 200 Words] (2013)</textarea>
            </div>

            <div class="text-xs text-slate-500 border-t pt-3">
                <strong>How to save:</strong> Click <strong>"Print / Save as PDF"</strong> $\rightarrow$ set Destination to <strong>"Save as PDF"</strong> $\rightarrow$ select Margins: <strong>"None"</strong>.
            </div>
        </div>

        <!-- Sheet Preview Area -->
        <div class="lg:col-span-2 overflow-x-auto flex flex-col items-center">
            <div id="pdfContainer" class="w-full">
                <!-- Dynamic A4 Pages -->
            </div>
        </div>

    </main>

    <script>
        function renderSheets() {
            const container = document.getElementById('pdfContainer');
            const globalTopic = document.getElementById('globalTopic').value || "UPSC Practice Sheet";
            const rawText = document.getElementById('bulkQuestions').value;
            
            const questions = rawText.split('\n').map(q => q.trim()).filter(q => q.length > 0);
            
            container.innerHTML = '';

            if (questions.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-12">No questions entered. Paste your questions on the left.</div>';
                return;
            }

            questions.forEach((qText, index) => {
                const qNo = `Q.${index + 1}`;
                
                const pageHtml = `
                    <div class="a4-page flex flex-col justify-between text-slate-800">
                        <!-- Top Header Box -->
                        <div>
                            <div class="border border-black flex text-xs font-bold">
                                <div class="p-2 border-r border-black flex-grow bg-slate-50 uppercase tracking-wide">
                                    ${globalTopic}
                                </div>
                                <div class="p-2 bg-slate-100 whitespace-nowrap">
                                    Brainstorming Mode
                                </div>
                            </div>

                            <!-- Additional Updates & Question Section -->
                            <div class="grid grid-cols-12 border-x border-b border-black">
                                <div class="col-span-4 border-r border-black p-3 flex flex-col justify-between">
                                    <div>
                                        <div class="text-[11px] font-bold tracking-wider text-slate-600 uppercase text-center border-b border-dashed border-slate-400 pb-1 mb-2">
                                            Additional Updates
                                        </div>
                                        <div class="text-center">
                                            <span class="text-xs font-bold inline-block">&#8595;</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-span-8 p-3 text-xs leading-relaxed">
                                    <span class="font-bold">${qNo})</span> ${qText}
                                </div>
                            </div>
                        </div>

                        <!-- Brainstorming Space Body -->
                        <div class="flex-grow grid grid-cols-12 border-x border-b border-black my-4 relative flex-1 min-h-[500px]">
                            <div class="col-span-4 border-r border-black p-2"></div>
                            <div class="col-span-8 relative flex items-center justify-center">
                                <div class="absolute left-3 top-2 flex items-center gap-1 text-[11px] font-bold uppercase tracking-widest text-slate-400">
                                    <span>Brainstorming Space</span>
                                    <span>&#8594;</span>
                                </div>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="flex justify-between items-center text-xs font-semibold text-slate-600 pt-2 border-t border-slate-200">
                            <span>Question ${index + 1} of ${questions.length}</span>
                            <span>UPSC Practice Booklet</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', pageHtml);
            });
        }

        renderSheets();
    </script>
</body>
</html>
